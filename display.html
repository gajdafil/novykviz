<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz</title>
<style>
:root{--blue:#003399;--gold:#ffcc00;--n:1;--rh:min(10vh,calc(66vh / var(--n)))}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,#0a47c4,#001a5c 70%);color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vh 5vw;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2rem,6vh,4.5rem);margin:0 0 3vh;color:var(--gold);letter-spacing:.03em}
.kick{font-size:clamp(1.2rem,3.4vh,2.4rem);color:var(--gold);margin-bottom:3vh;font-weight:700}
.big{font-size:clamp(2rem,7vh,5.5rem);font-weight:800;line-height:1.2;max-width:90vw}
.ans{white-space:pre-line;margin-top:5vh;font-size:clamp(2rem,8vh,6rem);font-weight:800;background:var(--gold);color:var(--blue);padding:1vh 4vw;border-radius:20px;animation:pop .6s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#clk{font-size:clamp(5rem,28vh,22rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#clk.low{color:#ff5a5a;animation:pulse 1s infinite}#clk.zero{color:#ff5a5a}
@keyframes pulse{50%{transform:scale(1.06)}}
.board{position:relative;width:min(92vw,1100px);height:calc(var(--rh)*var(--n))}
.row{display:flex;align-items:center;gap:2vw;padding:0 2vw;background:#ffffff1c;border-radius:16px;font-size:calc(var(--rh)*.42);height:calc(var(--rh) - 10px);margin-bottom:10px}
.row .k{width:2ch;font-weight:800;color:var(--gold)}.row .t{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .p{font-weight:800;background:var(--gold);color:var(--blue);padding:0 1.2ch;border-radius:10px;min-width:3.5ch}
.row .d{opacity:.85;min-width:9ch}.row.win{background:#ffcc0044;border:3px solid var(--gold)}
.tipr .row{animation:in .6s both}
.list{width:min(92vw,1100px)}svg{width:min(60vh,50vw);height:auto;background:#fff;border-radius:16px;padding:8px}
.sm{font-size:clamp(1rem,3vh,2rem);opacity:.85;margin-top:2vh}

.qa{display:flex;flex-direction:column;width:100%;height:100%;min-height:0}.qa .kick{flex:none;margin-bottom:1vh}
.fb{display:flex;align-items:center;justify-content:center;min-height:0;width:100%}.fb.q{flex:2}.fb.a{flex:1}
.fit{max-width:100%;overflow-wrap:anywhere;white-space:pre-line}.qa .ans{margin:0;padding:1vh 3vw}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="stage"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js?v=5"></script><script src="common.js?v=5"></script><script src="display.js?v=5"></script></body></html>
